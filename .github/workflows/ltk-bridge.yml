name: LTK Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'ltk-bridge/**'
      - '.github/workflows/ltk-bridge.yml'
  pull_request:
    paths:
      - 'ltk-bridge/**'
      - '.github/workflows/ltk-bridge.yml'

permissions:
  contents: read

jobs:
  build-native:
    name: Build LTF bridge (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./ltk-bridge/native/ltf/build.ps1 -Configuration Release

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --project ltk-bridge

      - name: Build backend exe
        shell: pwsh
        run: |
          uv run --project ltk-bridge pyinstaller --noconfirm --clean --onefile --windowed `
            --name sona-ltk --paths ltk-bridge/src `
            --distpath dist --workpath build/pyinstaller --specpath build `
            --collect-all pydantic --collect-all pydantic_core `
            --collect-all websockets --collect-all httpx --collect-all httpcore `
            --collect-all anyio --collect-all psutil `
            ltk-bridge/entrypoint.py

      - name: Smoke test backend exe
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist/sona-ltk.exe" `
            -ArgumentList @('--port', '50011', '--token', 'smoke-test-token') -PassThru
          $listening = $false
          try {
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 1
              if (Get-NetTCPConnection -LocalPort 50011 -State Listen -ErrorAction SilentlyContinue) {
                $listening = $true
                break
              }
              if ($proc.HasExited) { break }
            }
            if (-not $listening) {
              if (Test-Path dist/logs/sona-ltk.log) {
                Get-Content dist/logs/sona-ltk.log -Tail 40
              }
              throw "sona-ltk.exe 未在 30 秒内监听 50011"
            }
            Write-Host "sona-ltk.exe smoke test passed"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Verify artifacts
        shell: pwsh
        run: |
          $required = @(
            'ltk-bridge/native/ltf/bin/ltk_launcher.exe',
            'ltk-bridge/native/ltf/bin/LeagueToolFlop.dll',
            'dist/sona-ltk.exe'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "缺少构建产物：$file"
            }
            $item = Get-Item $file
            Write-Host "$($item.Name): $($item.Length) bytes"
          }

      - name: Assemble runtime bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/ltk-runtime | Out-Null
          Copy-Item ltk-bridge/native/ltf/bin/ltk_launcher.exe artifacts/ltk-runtime/
          Copy-Item ltk-bridge/native/ltf/bin/LeagueToolFlop.dll artifacts/ltk-runtime/
          Copy-Item dist/sona-ltk.exe artifacts/ltk-runtime/
          Copy-Item ltk-bridge/config.example.json artifacts/ltk-runtime/
          Copy-Item ltk-bridge/packaging/start-sona-ltk.bat artifacts/ltk-runtime/
          Copy-Item ltk-bridge/packaging/install-autostart.bat artifacts/ltk-runtime/
          Copy-Item ltk-bridge/packaging/uninstall-autostart.bat artifacts/ltk-runtime/
          Copy-Item ltk-bridge/packaging/README.md artifacts/ltk-runtime/README.md
          Copy-Item ltk-bridge/native/ltf/LICENSE artifacts/ltk-runtime/LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ltk-runtime
          path: artifacts/ltk-runtime/
          if-no-files-found: error
          retention-days: 30

  test-python:
    name: Test ltk-bridge (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --project ltk-bridge

      - name: Lint
        run: uv run --project ltk-bridge ruff check ltk-bridge/src ltk-bridge/tests ltk-bridge/entrypoint.py

      - name: Test
        run: uv run --project ltk-bridge pytest

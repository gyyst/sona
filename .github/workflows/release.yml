name: Release

# 三种触发方式：
# 1. 推送 v* tag（手动兜底发布）
# 2. 由 publish.yml / update-balance.yml 通过 workflow_call 调用
#    注意：GITHUB_TOKEN 推送的 tag 不会触发 push 事件，因此内部发布必须走 workflow_call。
# 3. 手动指定 tag（用于重建失败的发布或补发历史 tag）
#    注意：tag 对应提交中的 package.json 版本必须与 tag 一致。

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: '要发布的 tag，例如 v2026.11.24.1'
        required: true
        type: string
      notes:
        description: '发布说明；留空则从 CHANGELOG.md 提取'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布或重新发布的 tag，例如 v2026.11.24.1'
        required: true
        type: string
      notes:
        description: '发布说明；留空则从 CHANGELOG.md 提取'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      # workflow_call 时 github.ref_name 是调用方分支名，必须优先使用传入的 tag
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify version matches tag
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json 版本（${PKG_VERSION}）与 tag（${RELEASE_TAG}）不一致，请先用 scripts/update-version.mjs 同步"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: |
          # CI 环境：将 loaderPath 指向当前目录，让构建产物输出到项目内
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json','utf8'));
            pkg.config.loaderPath = './';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          npx tsc
          npx vite build

      - name: Prepare release package
        run: |
          mkdir -p release/sona
          # 复制构建产物
          cp dist/index.js release/sona/
          cp dist/index.css release/sona/
          # 复制 assets（如果存在）
          if [ -d "dist/assets" ]; then
            cp -r dist/assets release/sona/
          fi
          # 预留用户自定义资源目录，用户可把头像、背景等图片放到这里
          mkdir -p release/sona/assets
          cat > release/sona/assets/README.txt <<'EOF'
          中文：
          这里是 Sona 的自定义资源目录。
          你可以把头像、背景、图标等图片放在这个 assets 文件夹里。

          English:
          This is Sona's custom assets folder.
          You can put custom avatars, backgrounds, icons, and other images in this assets folder.
          EOF
          # 打包
          cd release
          zip -r "../sona-${RELEASE_TAG}.zip" sona/

      - name: Resolve release notes
        id: notes
        env:
          PROVIDED_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          NOTES=""
          if [ -n "$PROVIDED_NOTES" ]; then
            NOTES="$PROVIDED_NOTES"
          elif [ -f CHANGELOG.md ]; then
            # 提取当前版本标题到下一个版本标题之间的内容
            TAG_VERSION="${RELEASE_TAG#v}"
            ESCAPED_VERSION=${TAG_VERSION//./\\.}
            NOTES=$(sed -n "/^## \[${ESCAPED_VERSION}\]/,/^## \[/{ /^## \[${ESCAPED_VERSION}\]/d; /^## \[/d; p; }" CHANGELOG.md || true)
          fi
          if [ -z "${NOTES//[[:space:]]/}" ]; then
            NOTES="Release ${RELEASE_TAG}"
          fi
          {
            echo "notes<<EOF_RELEASE_NOTES"
            printf '%s\n' "$NOTES"
            echo "EOF_RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Sona ${{ env.RELEASE_TAG }}
          body: ${{ steps.notes.outputs.notes }}
          files: sona-${{ env.RELEASE_TAG }}.zip
          draft: false
          prerelease: false

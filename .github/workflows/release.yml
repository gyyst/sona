name: Release

# 三种触发方式：
# 1. 推送 v* tag（手动兜底发布）
# 2. 由 publish.yml / update-balance.yml 通过 workflow_call 调用
#    注意：GITHUB_TOKEN 推送的 tag 不会触发 push 事件，因此内部发布必须走 workflow_call。
# 3. 手动指定 tag（用于重建失败的发布或补发历史 tag）
#    注意：tag 对应提交中的 package.json 版本必须与 tag 一致。

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: '要发布的 tag，例如 v2026.11.24.1'
        required: true
        type: string
      notes:
        description: '发布说明；留空则从 CHANGELOG.md 提取'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布或重新发布的 tag，例如 v2026.11.24.1'
        required: true
        type: string
      notes:
        description: '发布说明；留空则从 CHANGELOG.md 提取'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-ltf-bridge:
    name: Build LTF bridge (Windows x64)
    runs-on: windows-latest
    env:
      # workflow_call 时 github.ref_name 是调用方分支名，必须优先使用传入的 tag
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build LTF bridge
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./lib/ltk-bridge/native/ltf/build.ps1 -Configuration Release

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --project lib/ltk-bridge

      - name: Build backend exe
        shell: pwsh
        run: |
          uv run --project lib/ltk-bridge pyinstaller --noconfirm --clean --onefile --windowed `
            --name sona-ltk --paths lib/ltk-bridge/src `
            --distpath dist --workpath build/pyinstaller --specpath build `
            --collect-all pydantic --collect-all pydantic_core `
            --collect-all websockets --collect-all httpx --collect-all httpcore `
            --collect-all anyio --collect-all psutil `
            lib/ltk-bridge/entrypoint.py

      - name: Smoke test backend exe
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist/sona-ltk.exe" `
            -ArgumentList @('--port', '50011', '--token', 'smoke-test-token') -PassThru
          $listening = $false
          try {
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 1
              if (Get-NetTCPConnection -LocalPort 50011 -State Listen -ErrorAction SilentlyContinue) {
                $listening = $true
                break
              }
              if ($proc.HasExited) { break }
            }
            if (-not $listening) {
              if (Test-Path dist/logs/sona-ltk.log) {
                Get-Content dist/logs/sona-ltk.log -Tail 40
              }
              throw "sona-ltk.exe 未在 30 秒内监听 50011"
            }
            Write-Host "sona-ltk.exe smoke test passed"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Verify artifacts
        shell: pwsh
        run: |
          $required = @(
            'lib/ltk-bridge/native/ltf/bin/ltk_launcher.exe',
            'lib/ltk-bridge/native/ltf/bin/LeagueToolFlop.dll',
            'dist/sona-ltk.exe'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "缺少构建产物：$file"
            }
            $item = Get-Item $file
            Write-Host "$($item.Name): $($item.Length) bytes"
          }

      - name: Assemble runtime bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/ltk-runtime | Out-Null
          Copy-Item lib/ltk-bridge/native/ltf/bin/ltk_launcher.exe artifacts/ltk-runtime/
          Copy-Item lib/ltk-bridge/native/ltf/bin/LeagueToolFlop.dll artifacts/ltk-runtime/
          Copy-Item dist/sona-ltk.exe artifacts/ltk-runtime/
          Copy-Item lib/ltk-bridge/config.example.json artifacts/ltk-runtime/
          Copy-Item lib/ltk-bridge/packaging/start-sona-ltk.bat artifacts/ltk-runtime/
          Copy-Item lib/ltk-bridge/packaging/install-autostart.bat artifacts/ltk-runtime/
          Copy-Item lib/ltk-bridge/packaging/uninstall-autostart.bat artifacts/ltk-runtime/
          Copy-Item lib/ltk-bridge/packaging/README.md artifacts/ltk-runtime/README.md
          Copy-Item lib/ltk-bridge/native/ltf/LICENSE artifacts/ltk-runtime/LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ltk-runtime
          path: artifacts/ltk-runtime/
          if-no-files-found: error

  resolve-ltk-version:
    name: Resolve LTK Manager version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read the submodule version
        id: version
        run: |
          set -euo pipefail
          # 安装包版本来自 fork 的 package.json，由 submodule 提交锁定，
          # 与 Sona 自身的日期版本互不影响。
          VERSION=$(node -p "require('./lib/ltk-manager/package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            echo "::error::lib/ltk-manager 的版本 ${VERSION} 含预发布后缀，安装包版本必须是稳定版"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # 构建哪一份 fork 代码由子模块 gitlink 锁定，而不是 fork 的 main，
          # 否则同一次发布可能构建出与所测版本不同的代码。
          # 必须读 gitlink：子模块未初始化时 `git -C lib/ltk-manager rev-parse HEAD`
          # 返回的是父仓库 HEAD，那是 sona 的提交，fork 上并不存在。
          REF=$(git ls-tree HEAD lib/ltk-manager | awk '{print $3}')
          if [[ ! "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::无法从子模块 gitlink 读取 fork 提交（得到 '${REF}'）"
            exit 1
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

  build-ltk-manager:
    name: Build LTK Manager installer (Windows x64)
    needs: resolve-ltk-version
    permissions:
      contents: read
    # 可复用工作流只能在 job 级调用，不能写成 step。
    uses: gyyst/ltk-manager/.github/workflows/build-for-sona.yml@main
    with:
      version: ${{ needs.resolve-ltk-version.outputs.version }}
      ref: ${{ needs.resolve-ltk-version.outputs.ref }}
      # 上游端点会把用户更新回未打补丁的版本，因此默认关闭；
      # 配置 SONA_LTK_UPDATER_ENDPOINT / PUBKEY 后指向自有 releases。
      updater_endpoint: ${{ vars.SONA_LTK_UPDATER_ENDPOINT }}
      updater_pubkey: ${{ vars.SONA_LTK_UPDATER_PUBKEY }}

  package-ltk-manager:
    name: Package LTK Manager installer
    needs: [resolve-ltk-version, build-ltk-manager]
    runs-on: windows-latest
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: ltk-manager-installer
          path: artifacts/manager

      - name: Write bundled manager manifest
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve-ltk-version.outputs.version }}
        run: |
          $file = Get-ChildItem -Path artifacts/manager -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $file) { throw "未找到 LTK Manager 安装包" }
          $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLower()
          $manifest = [ordered]@{
            version = $env:VERSION
            file = $file.Name
            sha256 = $hash
            size = $file.Length
          }
          $manifest | ConvertTo-Json | Set-Content -Path artifacts/manager/manifest.json -Encoding utf8
          Write-Host "$($file.Name) sha256=$hash size=$($file.Length)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ltk-manager
          path: artifacts/manager/
          if-no-files-found: error

  build-and-release:
    needs: [build-ltf-bridge, package-ltk-manager]
    runs-on: ubuntu-latest

    env:
      # workflow_call 时 github.ref_name 是调用方分支名，必须优先使用传入的 tag
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify version matches tag
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json 版本（${PKG_VERSION}）与 tag（${RELEASE_TAG}）不一致，请先用 scripts/update-version.mjs 同步"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: |
          set -euo pipefail
          # CI 环境：将 loaderPath 指向当前目录，让构建产物输出到项目内
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json','utf8'));
            pkg.config.loaderPath = './';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          npx tsc
          npx vite build
          # 补发旧 tag（自动更新引导器之前）时没有该脚本，跳过自动更新契约校验
          if [ -f scripts/check-build.mjs ]; then node scripts/check-build.mjs; fi

      - name: Download LTF runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: ltk-runtime
          path: artifacts/ltk

      - name: Download LTK Manager artifact
        uses: actions/download-artifact@v4
        with:
          name: ltk-manager
          path: artifacts/manager

      - name: Prepare release package
        run: |
          set -euo pipefail
          mkdir -p release/sona
          # 新版：冻结引导器 + 可更新应用包 + 更新清单；旧 tag：单文件 index.js / index.css
          if [ -f dist/app.js ]; then
            cp dist/index.js dist/app.js dist/app.css dist/version.json dist/update.json release/sona/
          else
            cp dist/index.js dist/index.css release/sona/
          fi
          # 随插件包分发原生 LTF bridge 与可执行后台，供本地直接启动
          mkdir -p release/sona/ltk
          cp -a artifacts/ltk/. release/sona/ltk/
          # 随包分发自维护的 LTK Manager 安装包：后台优先使用它，缺失时才回退内置地址
          mkdir -p release/sona/ltk/manager
          cp -a artifacts/manager/. release/sona/ltk/manager/
          # 预留用户自定义资源目录，用户可把头像、背景等图片放到这里
          mkdir -p release/sona/assets
          cat > release/sona/assets/README.txt <<'EOF'
          中文：
          这里是 Sona 的自定义资源目录。
          你可以把头像、背景、图标等图片放在这个 assets 文件夹里。

          English:
          This is Sona's custom assets folder.
          You can put custom avatars, backgrounds, icons, and other images in this assets folder.
          EOF
          # 打包
          cd release
          zip -r "../sona-${RELEASE_TAG}.zip" sona/

      - name: Resolve release notes
        id: notes
        env:
          PROVIDED_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          NOTES=""
          if [ -n "$PROVIDED_NOTES" ]; then
            NOTES="$PROVIDED_NOTES"
          elif [ -f CHANGELOG.md ]; then
            # 提取当前版本标题到下一个版本标题之间的内容
            TAG_VERSION="${RELEASE_TAG#v}"
            ESCAPED_VERSION=${TAG_VERSION//./\\.}
            NOTES=$(sed -n "/^## \[${ESCAPED_VERSION}\]/,/^## \[/{ /^## \[${ESCAPED_VERSION}\]/d; /^## \[/d; p; }" CHANGELOG.md || true)
          fi
          if [ -z "${NOTES//[[:space:]]/}" ]; then
            NOTES="Release ${RELEASE_TAG}"
          fi
          {
            echo "notes<<EOF_RELEASE_NOTES"
            printf '%s\n' "$NOTES"
            echo "EOF_RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Publish update artifacts (dist tag)
        run: |
          set -euo pipefail
          DIST_TAG="dist-${RELEASE_TAG}"

          # 补发旧 tag（自动更新引导器之前）没有 app.js，跳过自动更新产物发布
          if [ ! -f "$GITHUB_WORKSPACE/dist/app.js" ]; then
            echo "旧 tag 没有 app.js，跳过 dist 更新产物发布"
            exit 0
          fi

          # 发布标签不可变：已存在则跳过，让重跑可以继续创建/更新 GitHub Release
          if git ls-remote --exit-code --tags origin "refs/tags/${DIST_TAG}" >/dev/null 2>&1; then
            echo "::warning::标签 ${DIST_TAG} 已存在，跳过更新产物发布（保留不可变标签）。如需重新生成产物，请发布新版本。"
            exit 0
          fi

          # 用独立 worktree 发布 dist，避免清空主工作区（Release zip 仍在工作区根目录）
          WORKTREE="$(mktemp -d)"
          git worktree add --detach "$WORKTREE" HEAD
          cd "$WORKTREE"
          git checkout --orphan "dist-publish-${GITHUB_RUN_ID}"
          git rm -rf .
          cp "$GITHUB_WORKSPACE/dist/app.js" "$GITHUB_WORKSPACE/dist/app.css" "$GITHUB_WORKSPACE/dist/update.json" .
          git add app.js app.css update.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: 发布更新产物 ${DIST_TAG}"
          git push --force origin HEAD:dist
          git tag "${DIST_TAG}"
          git push origin "${DIST_TAG}"

          cd "$GITHUB_WORKSPACE"
          git worktree remove "$WORKTREE" --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Sona ${{ env.RELEASE_TAG }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            sona-${{ env.RELEASE_TAG }}.zip
          draft: false
          prerelease: false

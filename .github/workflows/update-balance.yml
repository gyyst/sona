name: Update Champion Balance

on:
  schedule:
    # 每周三/四/五 09:00 UTC（对准拳头补丁发布日，Wiki 通常当天或次日同步，本来用的Meraki CDN，但是那个数据有的不准。）
    - cron: "0 9 * * 3,4,5"
  workflow_dispatch:

permissions:
  contents: write

# 与 publish.yml 共用同一分组，保证发布相关操作串行执行
concurrency:
  group: release-pipeline
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.update.outputs.exit_code == '0' }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run balance updater
        id: update
        run: |
          set +e
          npm run update-balance
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Stop if no update
        if: steps.update.outputs.exit_code != '0'
        run: |
          echo "✓ 数据无变化，结束流程"
          exit 0

      - name: Compute next version
        if: steps.update.outputs.exit_code == '0'
        id: version
        run: |
          set -euo pipefail
          VERSION=$(node scripts/next-version.mjs)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "新版本：v${VERSION}"

      - name: Update version and CHANGELOG
        if: steps.update.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          node scripts/update-version.mjs "$VERSION"

          COUNT=$(node -p "require('./src/data/champion-balance.json')._meta.championCount")
          cat > /tmp/balance-notes.md <<EOF
          - **英雄平衡数据更新** — 从 Fandom LoL Wiki 同步最新模式平衡数值（共 ${COUNT} 个英雄，覆盖 ARAM / URF / 克隆 / 极限闪击 / 斗魂竞技场 / 终极魔咒书）
          EOF

          DATE_DISPLAY=$(echo "$VERSION" | awk -F. '{printf "%s-%s-%s", $1, $2, $3}')
          node scripts/prepend-changelog.mjs "$VERSION" "$DATE_DISPLAY" /tmp/balance-notes.md "🔄 自动更新"

      - name: Configure git
        if: steps.update.outputs.exit_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit, tag and push
        if: steps.update.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          git add src/data/champion-balance.json package.json package-lock.json CHANGELOG.md
          git commit -m "chore: 自动更新英雄平衡数据 (${TAG})"
          git tag "$TAG"
          git push origin HEAD:main
          git push origin "$TAG"
          echo "✓ 已推送 ${TAG}，将由 release job 构建发布"

  release:
    needs: check-and-update
    if: needs.check-and-update.outputs.updated == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.check-and-update.outputs.tag }}
